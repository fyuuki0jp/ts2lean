name: Publish verified 0.3.0 artifact
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  packages: write
concurrency:
  group: publish-verified-v030
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          scope: '@fyuuki0jp'
      - run: npm install --global npm@12.2.1
      - name: Install pinned Lean toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --no-modify-path --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - name: Verify separate proof budgets
        run: |
          npm run build
          node node_modules/vitest/vitest.mjs run --config examples/payments/vitest.config.ts di.test.ts --testNamePattern factory
      - name: Retrieve the successful build from the exact release source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/41723524135" > verified-run.json
          python3 - <<'PY'
          import json
          run = json.load(open('verified-run.json'))
          assert run['id'] == 41723524135
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['head_sha'] == '424b05e82aa41f66c8eabbb9ff3b792aad044be0'
          assert run['event'] == 'push' and run['head_branch'] == 'main'
          assert run['path'] == '.github/workflows/ci.yml'
          PY
          gh run download 41723524135 --repo "$GITHUB_REPOSITORY" --name npm-package --dir verified
      - name: Change only the package version
        run: |
          python3 - <<'PY'
          import json, pathlib, re, tarfile
          archives = list(pathlib.Path('verified').glob('*.tgz'))
          assert len(archives) == 1
          with tarfile.open(archives[0]) as archive:
              archive.extractall('stable', filter='data')
          path = pathlib.Path('stable/package/package.json')
          manifest = json.loads(path.read_text())
          assert manifest['name'] == '@fyuuki0jp/ts2lean'
          assert re.fullmatch(r'0\.3\.0-dev\.\d+\.1\.g424b05e82aa4', manifest['version'])
          manifest['version'] = '0.3.0'
          path.write_text(json.dumps(manifest, indent=2) + '\n')
          PY
          mkdir release
          cd stable/package
          npm pack --ignore-scripts --pack-destination ../../release
      - name: Check every packaged byte against the verified artifact
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, tarfile
          def contents(directory):
              archives = list(pathlib.Path(directory).glob('*.tgz'))
              assert len(archives) == 1
              with tarfile.open(archives[0]) as archive:
                  return {entry.name: archive.extractfile(entry).read()
                          for entry in archive.getmembers() if entry.isfile()}
          before, after = contents('verified'), contents('release')
          old = json.loads(before.pop('package/package.json'))
          new = json.loads(after.pop('package/package.json'))
          old['version'] = '0.3.0'
          assert old == new, 'Only the manifest version may change'
          assert before == after, 'Packaged files differ from the successful CI artifact'
          package = next(pathlib.Path('release').glob('*.tgz'))
          print('Verified artifact SHA-256:', hashlib.sha256(package.read_bytes()).hexdigest())
          PY
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish ./release/*.tgz --ignore-scripts --tag latest
      - name: Verify registry installation
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir consumer
          cd consumer
          npm init -y
          npm install --save-dev --ignore-scripts @fyuuki0jp/ts2lean@0.3.0
          npm exec -- ts2lean --help
          node --input-type=module -e 'import { ts2lean } from "@fyuuki0jp/ts2lean/vite"; if (typeof ts2lean !== "function") process.exit(1)'
